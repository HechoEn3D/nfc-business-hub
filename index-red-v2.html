html,body{margin:0;width:100%;height:100%;background:#080708;color:#fff;overflow:hidden;font-family:Inter,system-ui,sans-serif}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#080708;z-index:10;transition:opacity .5s}.loader{width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,#ff2638,#740913);box-shadow:0 0 65px rgba(255,38,56,.28);display:grid;place-items:center;font-weight:900}.loader:after{content:"";width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .7s ease}.ready iframe{opacity:1}.ready .loading{opacity:0;pointer-events:none}</style></head><body><div class="loading"><div class="loader">N</div></div><iframe id="site" src="index.html"></iframe><script>

.dash-top h3{color:#160f11!important}.stat{background:#fff!important;border-color:#eadedf!important}.chart{background:#fff!important;border-color:#eadedf!important}.chart .bar{background:linear-gradient(180deg,#ff5965,#9f0e1b)!important}
.field input,.field textarea,.field select{background:#151213!important;color:#fff!important;border-color:rgba(255,255,255,.10)!important}
.modal{background:rgba(0,0,0,.72)!important;backdrop-filter:blur(10px)}

.public-business-page{background:#080708!important;color:#fff!important}.public-card{background:#0f0c0e!important;border-color:rgba(255,255,255,.09)!important;box-shadow:0 30px 100px rgba(0,0,0,.45)!important}.public-cover{background:linear-gradient(135deg,#40070d,#b91627)!important}.public-action{background:#171214!important;border-color:rgba(255,255,255,.09)!important;color:#fff!important}.public-section-title{color:#fff!important}.public-menu-card{background:#171214!important;border-color:rgba(255,255,255,.08)!important;color:#fff!important}.public-footer{color:#8d7b7d!important;border-color:rgba(255,255,255,.08)!important}
.setup-modal .modal-box{background:linear-gradient(145deg,#171214,#0e0c0d)!important}.setup-card{background:#141113!important;border-color:rgba(255,255,255,.09)!important;color:#fff!important}.setup-card.active{border-color:#ff2638!important;box-shadow:0 0 0 3px rgba(255,38,56,.09)!important;background:#1b1113!important}.setup-card small{color:#a18e90!important}.setup-summary{background:#171113!important;border-color:rgba(255,255,255,.08)!important;color:#a18e90!important}
.footer{border-color:rgba(255,255,255,.08)!important}
.cta-shine{background:linear-gradient(135deg,#ff2638,#7d0915)!important;color:#fff!important;border:none!important;position:relative;overflow:hidden}

@keyframes redSweep{0%,65%{transform:translateX(-120%)}82%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.stat b,.price{color:#ff4b58!important}.public-topbar{background:rgba(8,7,8,.76)!important;border-color:rgba(255,255,255,.07)!important}.public-brand{color:#fff!important}.public-status{background:rgba(255,38,56,.10)!important;border-color:rgba(255,38,56,.22)!important;color:#ff9aa1!important}
@media(max-width:900px){.hero-grid{padding-left:0!important}.nav-links{display:none!important}.dashboard-wrap{background:#0c0b0c!important}}
`;
const frame=document.getElementById('site');
function skin(){try{const d=frame.contentDocument;if(!d||!d.head)return;const s=d.createElement('style');s.id='nfc-red-edition';s.textContent=css;d.head.appendChild(s);
const q=(sel)=>d.querySelector(sel);
const hero=q('.hero h1'); if(hero) hero.innerHTML='Todo tu negocio.<br><span style="color:#ff2638">En un toque.</span>';
const eyebrow=q('.eyebrow'); if(eyebrow) eyebrow.innerHTML='<span class="dot"></span> Hardware + software para negocios';
const cta=d.querySelector('.nav-cta'); if(cta) cta.textContent='Quiero mi NFC';
const body=d.body; if(body) body.dataset.redEdition='true';
if(!q('#red-cursor-style')){const x=d.createElement('style');x.id='red-cursor-style';x.textContent='body[data-red-edition=true]::selection{background:#ff2638;color:#fff} body[data-red-edition=true] .btn.primary,body[data-red-edition=true] .btn.gold{position:relative;overflow:hidden} body[data-red-edition=true] .btn.primary:after,body[data-red-edition=true] .btn.gold:after{content:"";position:absolute;inset:-30% -60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);transform:translateX(-100%);animation:redBtnSweep 4.8s ease-in-out infinite}@keyframes redBtnSweep{0%,65%{transform:translateX(-110%)}80%{transform:translateX(110%)}100%{transform:translateX(110%)}}';d.head.appendChild(x)}
d.defaultView.scrollTo(0,0);document.body.classList.add('ready');
}catch(e){setTimeout(skin,200)}}
frame.addEventListener('load',()=>setTimeout(skin,180));
</script></body></html>
