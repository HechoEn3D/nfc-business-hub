name: Build Redesign
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build red redesign from current index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          css=r'''/* REDLINE FULL REDESIGN */
:root{--bg:#07080b!important;--surface:#101217!important;--ink:#f7f7f5!important;--muted:#9699a3!important;--line:rgba(255,255,255,.10)!important;--accent:#ff2038!important;--accent2:#ff5a6a!important;--success:#55d39a!important;--danger:#ff5362!important;--radius:24px!important;--shadow:0 30px 100px rgba(0,0,0,.5)!important}
html{background:#07080b!important;scroll-behavior:smooth!important}
body{background:radial-gradient(circle at 9% 4%,rgba(255,32,56,.16),transparent 24%),radial-gradient(circle at 92% 19%,rgba(255,32,56,.10),transparent 23%),linear-gradient(180deg,#07080b,#0b0d11 52%,#08090c)!important;color:#f7f7f5!important}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.20;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(#000,transparent 82%)}
.nav{background:rgba(7,8,11,.72)!important;border-bottom:1px solid rgba(255,255,255,.07)!important;box-shadow:0 12px 48px rgba(0,0,0,.22)!important}.nav-inner{height:82px!important}.brand{color:#fff!important;font-weight:900!important}.brand-mark{background:linear-gradient(145deg,#ff3349,#8d0617)!important;box-shadow:0 0 32px rgba(255,32,56,.25)!important}.nav-links{color:#8c909b!important;gap:28px!important}.nav-links a:hover{color:#fff!important}.nav-cta{background:linear-gradient(135deg,#ff2038,#d20c20)!important;color:#fff!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 12px 34px rgba(255,32,56,.23)!important}
.hero{min-height:calc(100vh - 82px)!important;padding:92px 0 120px!important;position:relative;isolation:isolate}.hero:before{content:"";position:absolute;right:-250px;top:-170px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,32,56,.27),rgba(255,32,56,.07) 36%,transparent 70%);animation:redPulse 6s ease-in-out infinite;z-index:-1}.hero-grid{grid-template-columns:1.12fr .88fr!important;gap:82px!important;padding-left:0!important}.eyebrow{background:rgba(255,32,56,.055)!important;border-color:rgba(255,32,56,.25)!important;color:#ff9da6!important;backdrop-filter:blur(12px)}.dot{background:#ff3349!important;box-shadow:0 0 0 6px rgba(255,51,73,.10),0 0 20px rgba(255,51,73,.85)!important}.hero h1{color:#fff!important;font-size:clamp(54px,7vw,96px)!important;line-height:.90!important;letter-spacing:-.075em!important}.hero h1 span{background:linear-gradient(100deg,#ff2138,#ff7884 55%,#ff263c)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}.hero p{color:#aeb1bb!important;font-size:19px!important}.btn{background:rgba(255,255,255,.045)!important;color:#f7f7f5!important;border-color:rgba(255,255,255,.11)!important;border-radius:15px!important;backdrop-filter:blur(12px)}.btn:hover{transform:translateY(-4px)!important;background:rgba(255,255,255,.075)!important;border-color:rgba(255,255,255,.19)!important;box-shadow:0 20px 45px rgba(0,0,0,.28)!important}.btn.primary,.btn.gold{background:linear-gradient(135deg,#ff2038,#d10c20)!important;color:#fff!important;border-color:rgba(255,255,255,.08)!important;box-shadow:0 18px 48px rgba(255,32,56,.25)!important}.btn.primary:hover,.btn.gold:hover{background:linear-gradient(135deg,#ff3d52,#eb132a)!important;box-shadow:0 24px 58px rgba(255,32,56,.34)!important}
.nfc-card{min-height:610px!important;border-radius:36px!important;background:linear-gradient(145deg,#17191f,#090a0d)!important;border:1px solid rgba(255,255,255,.09)!important;box-shadow:0 45px 120px rgba(0,0,0,.55)!important}.nfc-card:before{width:620px!important;height:620px!important;right:-230px!important;top:-210px!important;background:radial-gradient(circle,rgba(255,32,56,.42),rgba(103,4,17,.18) 34%,transparent 68%)!important;opacity:1!important}.nfc-card:after{content:"";position:absolute;inset:1px;border-radius:35px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.04),transparent 28%,transparent 70%,rgba(255,32,56,.08))}.nfc-base{width:300px!important;height:355px!important;border-radius:34px!important;bottom:88px!important;background:linear-gradient(145deg,#24262c,#08090b)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 45px 100px rgba(0,0,0,.65),0 0 70px rgba(255,32,56,.13)!important;animation:nfcFloatRed 4.8s ease-in-out infinite!important}.nfc-disc{width:244px!important;height:244px!important;background:radial-gradient(circle at 35% 20%,#8c1522,#34080e 58%,#09090b)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 85px rgba(255,32,56,.20)!important}.nfc-disc small{color:#ffbcc3!important}.nfc-disc span{color:#d7aeb2!important}.nfc-caption{color:#7e828c!important}
.section{padding:120px 0!important}.kicker{color:#ff5a6b!important}h2{color:#fff!important}.section-head p{color:#999ca6!important}.feature,.price-card{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015))!important;border:1px solid rgba(255,255,255,.09)!important;color:#fff!important;box-shadow:none!important}.feature:hover,.price-card:hover{border-color:rgba(255,32,56,.38)!important;box-shadow:0 28px 70px rgba(0,0,0,.28)!important}.feature .icon{color:#ff6574!important;background:rgba(255,32,56,.10)!important;border-color:rgba(255,32,56,.20)!important}.feature p,.small,.checks li{color:#9699a3!important}.price-card.popular{border-color:rgba(255,32,56,.52)!important;background:linear-gradient(155deg,rgba(255,32,56,.10),rgba(255,255,255,.025))!important}.badge{background:#ff2038!important;box-shadow:0 10px 28px rgba(255,32,56,.30)!important}.price{color:#fff!important}
.scroll-sticky{background:radial-gradient(circle at 74% 46%,rgba(255,32,56,.17),transparent 31%),#090a0d!important}.scroll-sticky:before{background:radial-gradient(circle at 74% 46%,rgba(255,32,56,.15),transparent 28%)!important}.scroll-kicker{color:#ff5c6b!important}.scroll-copy h2{color:#fff!important}.scroll-copy h2 span{color:#ff3046!important}.scroll-copy p{color:#999ca6!important}.joy-pill{background:rgba(255,32,56,.07)!important;border-color:rgba(255,32,56,.27)!important;color:#ff9da6!important}.scroll-phone-glow{background:radial-gradient(circle,rgba(255,32,56,.28),transparent 63%)!important}.scroll-phone-shell{background:#050609!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 35px 100px rgba(0,0,0,.68)!important}.scroll-phone-cover{background:linear-gradient(135deg,#420711,#b21628)!important}
.dashboard-wrap{background:linear-gradient(145deg,#111318,#0a0b0f)!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:32px!important;padding:16px!important;box-shadow:0 35px 110px rgba(0,0,0,.46)!important}.sidebar{background:#0d0f13!important;border:1px solid rgba(255,255,255,.07)!important;border-radius:22px!important}.side-brand{color:#fff!important}.side-item{color:#858995!important}.side-item.active{background:linear-gradient(135deg,rgba(255,32,56,.17),rgba(255,32,56,.04))!important;color:#ff7b87!important;border-color:rgba(255,32,56,.16)!important}.dash-main{background:#f3eff0!important;color:#151115!important;border-radius:22px!important}.stat,.panel,.chart,.info-row,.mini-table td{background:#fff!important;border-color:#e5dcdc!important}.dashboard-actions .btn{background:#17191e!important;color:#fff!important}
.public-business-page{background:#08090b!important;color:#fff!important}.public-brand{color:#fff!important}.public-status{background:rgba(255,32,56,.12)!important;color:#ff8994!important;border:1px solid rgba(255,32,56,.22)!important}.public-card{background:#0f1115!important;border:1px solid rgba(255,255,255,.09)!important;box-shadow:0 35px 110px rgba(0,0,0,.5)!important;border-radius:28px!important}.public-cover{background:linear-gradient(135deg,#35070d,#b31628)!important;padding:44px 30px 34px!important}.public-actions{background:#101217!important;padding:12px!important}.public-action{background:rgba(255,255,255,.035)!important;border-color:rgba(255,255,255,.09)!important;color:#fff!important}.public-action:hover{background:rgba(255,32,56,.08)!important;border-color:rgba(255,32,56,.35)!important}.public-content{background:#0f1115!important;color:#fff!important}.public-section-title{color:#fff!important}.public-menu-card,.promo-card{background:#15181d!important;border-color:rgba(255,255,255,.08)!important;color:#fff!important}.public-footer{background:#0a0b0e!important;color:#777b84!important}
.modal{background:rgba(0,0,0,.76)!important;backdrop-filter:blur(14px)}.modal-box{background:#111318!important;color:#fff!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 40px 120px rgba(0,0,0,.60)!important}.close{background:#1a1c21!important;color:#fff!important}.toast{background:#ff2038!important;box-shadow:0 20px 50px rgba(255,32,56,.35)!important}
.feature,.price-card,.panel,.stat,.public-action,.btn,.side-item,.qbtn,.menu-card,.promo-card{transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s ease,border-color .28s ease,background .28s ease!important}.feature:hover,.panel:hover{transform:translateY(-7px)!important}.price-card:hover,.stat:hover{transform:translateY(-8px) scale(1.008)!important}.side-item:hover{transform:translateX(4px)!important;background:rgba(255,32,56,.07)!important;color:#fff!important}.public-action:hover{transform:translateY(-2px)!important}.qbtn:hover,.menu-card:hover,.promo-card:hover{transform:translateY(-3px)!important}
body::before{background:linear-gradient(90deg,#ff2038,#ff8792,#ff2038)!important;box-shadow:0 0 20px rgba(255,32,56,.55)!important}
.hero-copy-reveal{animation:heroInRed 1s cubic-bezier(.16,1,.3,1) both!important}.hero-card-reveal{animation:heroCardRed 1.1s cubic-bezier(.16,1,.3,1) .08s both!important}
@keyframes redPulse{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.08);opacity:1}}@keyframes nfcFloatRed{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}50%{transform:translateX(-50%) translateY(-15px) rotate(1.5deg)}}@keyframes heroInRed{0%{opacity:0;transform:translateY(40px);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}@keyframes heroCardRed{0%{opacity:0;transform:translateY(35px) rotate(2deg) scale(.94);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@media(max-width:900px){.hero{padding:65px 0 90px!important}.hero-grid{gap:36px!important}.hero h1{font-size:clamp(48px,12vw,72px)!important}.nfc-card{min-height:540px!important}.section{padding:85px 0!important}.head{align-items:flex-start;flex-direction:column;gap:8px!important}}
@media(max-width:620px){.nav-inner{height:68px!important}.hero{min-height:auto!important;padding-top:48px!important}.hero p{font-size:16px!important}.actions .btn{width:100%}.nfc-card{min-height:480px!important}.nfc-base{width:235px!important;height:280px!important}.nfc-disc{width:195px!important;height:195px!important}}
@media(prefers-reduced-motion:reduce){.hero:before,.nfc-card:before,.nfc-base{animation:none!important}.hero-copy-reveal,.hero-card-reveal{animation:none!important;opacity:1!important;transform:none!important}}
'''
          i=src.rfind('</style>')
          out=src[:i]+css+'\n</style>'+src[i+8:]
          Path('index-red-v3.html').write_text(out,encoding='utf-8')
          PY
      - name: Commit generated redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-red-v3.html
          git commit -m 'build: publish full red visual redesign' || exit 0
          git push
