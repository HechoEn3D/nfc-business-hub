name: Load business type onboarding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject onboarding script
        shell: bash
        run: |
          set -e
          if grep -q 'business-type-onboarding.js' index.html; then
            echo 'business-type-onboarding.js already loaded'
            exit 0
          fi

          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='</body>'; tag='<script src=\"/business-type-onboarding.js\"></script>\\n'; assert marker in s, 'Could not find </body> in index.html'; p.write_text(s.replace(marker, tag+marker, 1), encoding='utf-8')"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: load business type onboarding'
          git push
