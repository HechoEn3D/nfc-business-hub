name: Load business type onboarding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject onboarding script
        shell: bash
        run: |
          set -e
          if ! grep -q 'business-type-onboarding.js' index.html; then
            python - <<'PY'
            from pathlib import Path
            p = Path('index.html')
            s = p.read_text(encoding='utf-8')
            marker = '</body>'
            tag = '<script src="/business-type-onboarding.js"></script>\n'
            if marker not in s:
                raise SystemExit('Could not find </body> in index.html')
            s = s.replace(marker, tag + marker, 1)
            p.write_text(s, encoding='utf-8')
            PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'feat: load business type onboarding'
            git push
          else
            echo 'business-type-onboarding.js already loaded'
          fi
